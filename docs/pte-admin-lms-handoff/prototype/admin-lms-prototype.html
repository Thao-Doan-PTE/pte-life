<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PTE-Life Admin LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: dark warm-charcoal sidebar + cream work area; tables + slide-in drawer for detail. Brand v3 60-30-10, no blue/navy. */
:root{
  --bg:#FFFFFF; --surface:#FBF8F3; --surface-2:#F3EDE4; --line:#E7DED2;
  --ink:#2A2421; --ink-2:#5D534C; --ink-3:#8A7F76;
  --brand:#D0202B; --brand-hover:#B21A24; --brand-soft:#FCEAE8; --on-brand:#FFFFFF;
  --plum:#7B3F6E; --plum-soft:#F4E9F1; --ok:#2C7647; --ok-soft:#E4F1E8; --warn:#9A5B0E; --warn-soft:#FBEFD9;
  --side:#2A2421; --side-2:#3A322D; --side-ink:#F1EAE1; --side-ink-2:#B0A397;
  --shadow:0 12px 40px rgba(42,36,33,.18);
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171311; --surface:#1F1A17; --surface-2:#2A2420; --line:#3A322C;
  --ink:#F2ECE5; --ink-2:#C9BEB3; --ink-3:#998C80;
  --brand:#EF4C51; --brand-hover:#F36B6F; --brand-soft:#3A1F1F; --on-brand:#1C0E0E;
  --plum:#D49CC6; --plum-soft:#36242F; --ok:#74C493; --ok-soft:#1C2E22; --warn:#E6A951; --warn-soft:#33281A;
  --side:#100D0C; --side-2:#241E1B; --side-ink:#F1EAE1; --side-ink-2:#A39588; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#171311; --surface:#1F1A17; --surface-2:#2A2420; --line:#3A322C;
  --ink:#F2ECE5; --ink-2:#C9BEB3; --ink-3:#998C80;
  --brand:#EF4C51; --brand-hover:#F36B6F; --brand-soft:#3A1F1F; --on-brand:#1C0E0E;
  --plum:#D49CC6; --plum-soft:#36242F; --ok:#74C493; --ok-soft:#1C2E22; --warn:#E6A951; --warn-soft:#33281A;
  --side:#100D0C; --side-2:#241E1B; --side-ink:#F1EAE1; --side-ink-2:#A39588; --shadow:0 12px 40px rgba(0,0,0,.5); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--surface);color:var(--ink);font:14px/1.5 var(--f-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--side);color:var(--side-ink);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:700;letter-spacing:.02em}
.logo b{width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font-size:13px}
.logo small{display:block;font-weight:500;color:var(--side-ink-2);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.role{background:var(--side-2);border:1px solid transparent;border-radius:10px;padding:8px 10px;color:var(--side-ink);width:100%}
.navg{display:flex;flex-direction:column;gap:2px}
.navg h6{margin:10px 8px 4px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--side-ink-2);font-weight:600}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;color:var(--side-ink-2);text-align:left;cursor:pointer;width:100%}
.nav:hover{background:var(--side-2);color:var(--side-ink)}
.nav.on{background:var(--side-2);color:var(--side-ink);box-shadow:inset 3px 0 0 var(--brand)}
.nav svg{width:17px;height:17px;flex:none}
.nav .cnt{margin-left:auto;font-size:11px;background:var(--brand);color:var(--on-brand);border-radius:99px;padding:0 7px;font-weight:600}
.side .foot{margin-top:auto;font-size:12px;color:var(--side-ink-2);padding:0 8px}
/* main */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 24px}
.top h1{font-size:18px;margin:0;font-weight:700;text-wrap:balance}
.top .sub{color:var(--ink-3);font-size:12.5px}
.menu{display:none;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 9px;cursor:pointer}
.top .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.sample{font-size:11.5px;background:var(--plum-soft);color:var(--plum);border-radius:99px;padding:3px 10px;font-weight:600;white-space:nowrap}
.content{padding:22px 24px 48px;display:flex;flex-direction:column;gap:20px}
/* blocks */
.panel{background:var(--bg);border:1px solid var(--line);border-radius:12px;min-width:0}
.ph{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ph h2{font-size:15px;margin:0;font-weight:650}
.ph .r{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pb{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--ink-3)}
.kpi .l{font-size:12px;color:var(--ink-2)}
.kpi .v{font-size:28px;font-weight:600;line-height:1.1}
.kpi .h{font-size:12px;color:var(--ink-3)}
.kpi.alert .v{color:var(--brand)}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--ink-3);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface)}
.who{display:flex;align-items:center;gap:10px;min-width:180px}
.av{width:32px;height:32px;border-radius:50%;background:var(--surface-2);color:var(--ink-2);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.who b{display:block;font-weight:600}
.who span{font-size:12px;color:var(--ink-3)}
/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--brand-soft);color:var(--brand)} .p-plum{background:var(--plum-soft);color:var(--plum)}
.p-mute{background:var(--surface-2);color:var(--ink-2)}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.tag.ac{border-color:var(--brand);color:var(--brand)}
/* controls */
.btn{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 13px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.pri:hover{background:var(--brand-hover);border-color:var(--brand-hover)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-2)}
.btn.danger{color:var(--brand);border-color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.in{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;min-width:0}
.in:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
.search{width:240px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--bg);padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--bg);font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;color:var(--ink-2);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
/* bars */
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ink-2);border-radius:99px}
.bar.r i{background:var(--brand)}
/* lists */
.todo{display:flex;flex-direction:column}
.todo .it{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.todo .it:last-child{border-bottom:0}
.todo .it .tx{min-width:0;flex:1}
.todo .it .tx b{font-weight:600}
.todo .it .tx div{font-size:12.5px;color:var(--ink-3)}
.stripe{width:4px;align-self:stretch;border-radius:4px;flex:none}
/* class cards */
.cls{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.cls h3{margin:0;font-size:15px}
.cls .meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px}
.cls .meta span:nth-child(odd){color:var(--ink-3)}
/* bank */
.skills{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sk{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.sk.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sk .v{font-size:22px;font-weight:600}
/* grading */
.gwrap{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:20px;align-items:start}
.q{display:flex;flex-direction:column}
.q button{border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:12px 16px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.q button:last-child{border-bottom:0}
.q button.on{background:var(--surface);box-shadow:inset 3px 0 0 var(--brand)}
.answer{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;line-height:1.7;max-width:70ch}
.audio{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.audio .play{width:34px;height:34px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);cursor:pointer}
.wave{flex:1;height:28px;display:flex;align-items:center;gap:2px;overflow:hidden}
.wave i{width:3px;border-radius:2px;background:var(--ink-3);flex:none}
.crit{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px 14px;align-items:center}
.crit .in{width:70px;text-align:center}
.total{display:flex;align-items:baseline;gap:10px;padding:12px 14px;background:var(--surface-2);border-radius:10px}
.total .v{font-size:26px;font-weight:600}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,15,13,.38);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);z-index:21;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dh{display:flex;gap:12px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.dh h2{margin:0;font-size:17px}
.db{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.db h4{margin:0 0 8px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.facts div{background:var(--surface);border-radius:10px;padding:10px 12px}
.facts span{display:block;font-size:11.5px;color:var(--ink-3)}
.facts b{font-size:15px}
.actbox{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px}
.sbars{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:13px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:30;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.log{display:flex;flex-direction:column}
.log .it{display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;padding:11px 16px;border-bottom:1px solid var(--line);align-items:center}
.log .it:last-child{border-bottom:0}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.gwrap{grid-template-columns:minmax(0,1fr)}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}.skills{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:25;transform:translateX(-100%);transition:transform .2s}
  .app.open .side{transform:none}
  .menu{display:block}
  .top{padding:10px 16px}.content{padding:16px 16px 40px}
  .grid3{grid-template-columns:minmax(0,1fr)}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .search{width:100%}
  .log .it{grid-template-columns:minmax(0,1fr)}
  .sample{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <div class="row" style="align-items:stretch"><div class="field" style="flex:1"><label for="aCls">Giao cho lớp</label><select id="aCls" class="in">${cs.map(c=>`<option value="${c.id}" ${c.id===pre?'selected':''}>${c.id} — ${c.name}</option>`).join('')}</select></div>
  <div class="field" style="flex:1"><label for="aKind">Hình thức</label><select id="aKind" class="in"><option>Luyện đề Tủ</option><option>Luyện đề</option><option>Mock test</option></select></div></div>
  <div class="field"><label>Dạng bài (chọn nhiều)</label><div class="row" id="aTypes">${opts.map(b=>`<label class="tag" style="cursor:pointer;display:inline-flex;gap:5px;align-items:center"><input type="checkbox" value="${b.code}"> ${b.code}</label>`).join('')}</div><span class="small muted">Danh sách lọc theo gói ${cls(pre).pkg} của lớp.</span></div>
  <div class="row" style="align-items:stretch"><div class="field" style="flex:1"><label for="aQty">Số câu</label><input id="aQty" type="number" min="1" value="20" class="in num"></div>
  <div class="field" style="flex:1"><label for="aDue">Hạn nộp</label><input id="aDue" type="date" class="in" value="${iso(new Date(TODAY.getTime()+3*864e5))}"></div></div>
  <label class="row small"><input type="checkbox" id="aNoti" checked> Gửi thông báo cho học viên trong lớp</label>
  <div class="row"><button class="btn pri" type="submit">Giao bài</button><span class="small muted" id="aErr"></span></div>
 </form></section></div>`;
};
V.grading=()=>{
 const list=S.subs.filter(x=>S.role!=='teacher'||stu(x.st).cls==='AC-K12'||true);
 const pend=list.filter(x=>x.status==='pending'), done=list.filter(x=>x.status==='graded');
 if(!S.gradeSel||!list.find(x=>x.id===S.gradeSel)) S.gradeSel=(pend[0]||done[0]||{}).id;
 const x=list.find(y=>y.id===S.gradeSel);
 const qi=y=>{const s=stu(y.st);return `<button data-gsel="${y.id}" class="${y.id===S.gradeSel?'on':''}"><span class="row" style="justify-content:space-between;width:100%"><b>${esc(s.name)}</b><span class="tag">${y.type}</span></span><span class="small muted">${esc(y.item)}</span><span class="small ${y.status==='graded'?'':'muted'}" style="${y.status==='graded'?'color:var(--ok)':''}">${y.status==='graded'?'Đã chấm · '+y.score.got+'/'+y.score.max:'Nộp '+y.at.slice(11)+' '+fmt(y.at.slice(0,10))}</span></button>`};
 let det='<div class="empty">Chọn một bài để chấm.</div>';
 if(x){const s=stu(x.st),R=RUBRIC[x.type];const sc=x.score?x.score.parts:R.c.map(()=>'');
  det=`<div class="ph"><div><h2>${R.label} — ${esc(s.name)}</h2><div class="small muted">${esc(x.item)} · lớp ${s.cls} · nộp ${x.at.slice(11)} ${fmt(x.at.slice(0,10))}</div></div><div class="r">${x.status==='graded'?'<span class="pill p-ok">Đã trả bài</span>':'<span class="pill p-warn">Chờ chấm</span>'}</div></div>
  <div class="pb" style="display:flex;flex-direction:column;gap:16px">
   ${R.kind==='text'?`<div class="answer">${esc(x.text).replace(/\n/g,'<br>')}</div><div class="small muted">Số từ: <span class="num">${x.text.split(/\s+/).filter(Boolean).length}</span></div>`:`<div class="audio"><button class="play" aria-label="Phát bản ghi">▶</button><div class="wave">${Array.from({length:70},(_,i)=>`<i style="height:${6+Math.abs(Math.sin(i*1.7+x.id.length))*20}px"></i>`).join('')}</div><span class="num small">${x.dur}</span></div><div class="small muted">AI đã chấm sơ bộ; giáo viên xác nhận hoặc điều chỉnh điểm.</div>`}
   <form id="gForm" style="display:flex;flex-direction:column;gap:12px">
    <div class="crit">${R.c.map(([n,m],i)=>`<label for="c${i}">${n}</label><input id="c${i}" class="in num" type="number" min="0" max="${m}" value="${sc[i]}" ${x.status==='graded'?'disabled':''}><span class="muted num small">/ ${m}</span>`).join('')}</div>
    <div class="total"><span class="muted">Tổng</span><span class="v num" id="gTot">${x.score?x.score.got:'–'}</span><span class="muted num">/ ${R.c.reduce((a,b)=>a+b[1],0)}</span></div>
    <div class="field"><label for="gNote">Nhận xét cho học viên</label><textarea id="gNote" class="in" rows="3" ${x.status==='graded'?'disabled':''} placeholder="VD: Bố cục rõ, cần thêm ví dụ cụ thể ở đoạn thân bài 2.">${esc(x.score?x.score.note:'')}</textarea></div>
    ${x.status==='graded'?'':'<div class="row"><button class="btn pri" type="submit">Lưu điểm & trả bài</button><span class="small muted" id="gErr"></span></div>'}
   </form></div>`;}
 return `<div class="gwrap"><section class="panel"><div class="ph"><h2>Hàng chờ</h2><span class="muted small">${pend.length} chờ chấm</span></div><div class="q">${pend.map(qi).join('')||'<div class="empty">Đã chấm hết bài.</div>'}</div>${done.length?`<div class="ph" style="border-top:1px solid var(--line)"><h2>Đã chấm</h2></div><div class="q">${done.map(qi).join('')}</div>`:''}</section><section class="panel">${det}</section></div>`;
};
V.teachers=()=>`<section class="panel"><div class="tw"><table><thead><tr><th>Giáo viên</th><th>Chuyên môn</th><th>Lớp phụ trách</th><th>Học viên</th><th>Bài chờ chấm</th></tr></thead><tbody>
 ${TEACHERS.map(t=>{const cs=CLASSES.filter(c=>c.teacher===t.id);const ids=S.students.filter(s=>cs.some(c=>c.id===s.cls)).map(s=>s.id);const p=S.subs.filter(x=>x.status==='pending'&&ids.includes(x.st)).length;return `<tr><td>${who(t.name,t.email)}</td><td>${t.skill}</td><td>${cs.map(c=>`<span class="tag">${c.id}</span>`).join(' ')}</td><td class="num">${ids.length}</td><td>${p?`<span class="pill p-warn">${p} bài</span>`:'<span class="pill p-ok">0</span>'}</td></tr>`}).join('')}
 </tbody></table></div></section>`;
V.bank=()=>{
 const tot=k=>BANK.filter(b=>b.skill===k).reduce((a,b)=>a+b.count,0);
 const list=BANK.filter(b=>b.skill===S.bankSkill);
 return `<div class="skills">${Object.entries(SKILLS).map(([k,l])=>`<button class="sk ${S.bankSkill===k?'on':''}" data-skill="${k}"><span class="small muted">${l}</span><span class="v num">${tot(k).toLocaleString('vi-VN')}</span><span class="small muted">${BANK.filter(b=>b.skill===k).length} dạng bài</span></button>`).join('')}
  <div class="sk" style="cursor:default"><span class="small muted">Câu thuộc đề Tủ</span><span class="v num" style="color:var(--brand)">${BANK.reduce((a,b)=>a+b.tu,0).toLocaleString('vi-VN')}</span><span class="small muted">Cập nhật theo đề thi thật</span></div></div>
 <section class="panel"><div class="ph"><h2>${SKILLS[S.bankSkill]}</h2><div class="r"><label class="row small"><input type="checkbox" id="tuOnly" ${S.bankTu?'checked':''}> Chỉ xem số câu Tủ</label>${S.role==='admin'?'<button class="btn pri sm" data-toast="Mở form thêm câu hỏi (bản thật nối API ngân hàng đề)">+ Thêm câu hỏi</button>':''}</div></div>
 <div class="tw"><table><thead><tr><th>Mã</th><th>Dạng bài</th><th>Áp dụng</th><th>${S.bankTu?'Câu Tủ':'Tổng câu'}</th><th>Tỷ lệ Tủ</th><th>Chấm</th><th></th></tr></thead><tbody>
 ${list.map(b=>`<tr><td><span class="tag">${b.code}</span></td><td><b>${b.name}</b></td><td>${b.test==='both'?'Academic · Core':b.test==='ac'?'Academic':'Core'}</td><td class="num">${S.bankTu?b.tu:b.count}</td><td style="min-width:120px"><div class="row" style="flex-wrap:nowrap"><span class="num small">${Math.round(100*b.tu/b.count)}%</span>${bar(100*b.tu/b.count,true)}</div></td><td><span class="pill ${b.grade==='Giáo viên'?'p-warn':b.grade==='AI'?'p-plum':'p-mute'}">${b.grade}</span></td><td><button class="btn sm ghost" data-toast="Mở danh sách câu ${b.code}">Xem câu</button></td></tr>`).join('')}
 </tbody></table></div></section>`;
};
V.entry=()=>`<section class="panel"><div class="ph"><h2>Kết quả test đầu vào</h2><div class="r"><span class="small muted">Thang điểm PTE 10–90</span></div></div><div class="tw"><table><thead><tr><th>Người làm test</th><th>Ngày</th><th>Overall</th><th>S</th><th>W</th><th>R</th><th>L</th><th>Lộ trình đề xuất</th><th></th></tr></thead><tbody>
 ${S.entry.map((e,i)=>{const s=e.st?stu(e.st):null;const n=s?s.name:e.name,m=s?s.email:e.email;const r=rec(e.overall);return `<tr><td>${who(n,m)}${e.lead?'<span class="pill p-plum" style="margin-top:4px">Khách tiềm năng</span>':''}</td><td class="num">${fmt(e.date)}</td><td class="num"><b>${e.overall}</b></td><td class="num">${e.S}</td><td class="num">${e.W}</td><td class="num">${e.R}</td><td class="num">${e.L}</td><td><b>${r[0]}</b><div class="small muted">Lớp gợi ý: ${r[1]}</div></td><td>${e.placed?'<span class="pill p-ok">Đã xếp lớp</span>':e.lead?`<button class="btn sm" data-toast="Đã chuyển ${esc(n)} cho tư vấn viên">Chuyển tư vấn</button>`:`<button class="btn pri sm" data-place="${i}">Xếp vào ${r[1].split(' / ').pop()}</button>`}</td></tr>`}).join('')}
 </tbody></table></div></section>`;
V.logs=()=>`<section class="panel"><div class="log">${S.logs.map(l=>`<div class="it"><span class="num small muted">${fmt(l.at)}</span><span>${esc(l.msg)}</span><span class="tag">${l.who}</span></div>`).join('')}</div></section>`;

/* ---------- drawer ---------- */
function renderLayer(){
 const L=document.getElementById('layer');
 if(!S.open){L.innerHTML=S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:'';return}
 const s=stu(S.open),st=status(s),c=cls(s.cls);
 const sk=[['Speaking',(s.prog*0.9+s.entry/3)|0],['Writing',(s.prog*0.8+12)|0],['Reading',(s.prog*0.7+20)|0],['Listening',(s.prog*0.95+5)|0]].map(([a,b])=>[a,Math.min(100,b)]);
 L.innerHTML=`<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-label="Hồ sơ học viên">
 <div class="dh"><div class="av" style="width:42px;height:42px">${esc(ini(s.name))}</div><div style="min-width:0"><h2>${esc(s.name)}</h2><div class="small muted">${esc(s.email)}</div></div><button class="btn ghost" data-close style="margin-left:auto" aria-label="Đóng">✕</button></div>
 <div class="db">
  <div class="row">${pkgTag(s.pkg)}<span class="pill ${st[1]}">${st[0]}</span>${c?`<span class="tag">${c.id} · ${tch(c.teacher).short}</span>`:'<span class="tag">Chưa xếp lớp</span>'}</div>
  <div class="facts"><div><span>Hết hạn</span><b class="num">${fmt(s.exp)}</b></div><div><span>Bảo lưu còn</span><b class="num">${s.res} lượt</b></div><div><span>Đầu vào → mục tiêu</span><b class="num">${s.entry} → ${s.target}</b></div></div>
  <div><h4>Gói học & thời hạn</h4><div class="actbox">
   <div class="row"><div class="field" style="flex:1"><label for="dPkg">Đổi gói</label><select id="dPkg" class="in"><option ${s.pkg==='Academic'?'selected':''} value="Academic">PTE Academic</option><option ${s.pkg==='Core'?'selected':''} value="Core">PTE Core</option></select></div><button class="btn" data-act="pkg" style="align-self:flex-end">Lưu</button></div>
   <div class="row"><div class="field" style="flex:1"><label for="dDays">Gia hạn (ngày)</label><div class="row">${[30,60,90].map(n=>`<button class="btn sm" data-days="${n}">+${n}</button>`).join('')}<input id="dDays" class="in num" type="number" min="1" value="30" style="width:80px"></div></div><button class="btn pri" data-act="extend" style="align-self:flex-end">Gia hạn</button></div>
   <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:12px"><span class="small muted">Bảo lưu cộng thêm 30 ngày vào hạn hiện tại.</span>${s.res>0?(S.confirmReserve?`<span class="row"><button class="btn sm ghost" data-act="reserveNo">Huỷ</button><button class="btn sm danger" data-act="reserveYes">Xác nhận dùng 1 lượt</button></span>`:`<button class="btn sm" data-act="reserve">Dùng 1 lượt bảo lưu</button>`):'<span class="pill p-mute">Hết lượt bảo lưu</span>'}</div>
  </div></div>
  <div><h4>Xếp lớp</h4><div class="row"><select id="dCls" class="in" style="flex:1"><option value="">— Chưa xếp lớp —</option>${CLASSES.filter(k=>k.pkg===s.pkg).map(k=>`<option value="${k.id}" ${k.id===s.cls?'selected':''}>${k.id} — ${k.name}</option>`).join('')}</select><button class="btn" data-act="cls">Lưu</button></div></div>
  <div><h4>Tiến độ theo kỹ năng</h4><div class="sbars">${sk.map(([a,b])=>`<span>${a}</span>${bar(b)}<span class="num small">${b}%</span>`).join('')}</div><div class="small muted" style="margin-top:6px">Hoạt động gần nhất: ${fmt(s.last)}</div></div>
  <div><h4>Lịch sử thao tác</h4>${S.logs.filter(l=>l.msg.startsWith(s.name+' ')).slice(0,5).map(l=>`<div class="small" style="padding:6px 0;border-bottom:1px solid var(--line)"><span class="num muted">${fmt(l.at)}</span> · ${esc(l.msg.slice(s.name.length+3))}</div>`).join('')||'<div class="small muted">Chưa có thao tác.</div>'}</div>
 </div></aside>${S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:''}`;
}
function renderToast(){renderLayer()}

/* ---------- render ---------- */
function render(){
 renderSide();
 const [t,sub]=TITLES[S.view];
 document.getElementById('pt').textContent=t;
 document.getElementById('ps').textContent=S.role==='teacher'&&S.view==='overview'?'Lớp AC-K12 của bạn · '+fmt(iso(TODAY)):sub;
 document.getElementById('view').innerHTML=V[S.view]();
 renderLayer();
 try{localStorage.setItem('pteadm',JSON.stringify({role:S.role,view:S.view}))}catch(e){}
}
function addDays(s,n){const d=D(s);d.setDate(d.getDate()+n);return iso(d)}

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-nav],[data-open],[data-close],[data-grade],[data-fpkg],[data-fst],[data-skill],[data-gsel],[data-act],[data-days],[data-assignto],[data-filtercls],[data-place],[data-toast],#menuBtn');
 if(!t) { if(document.getElementById('app').classList.contains('open')&&!e.target.closest('.side')) document.getElementById('app').classList.remove('open'); return; }
 const d=t.dataset;
 if(t.id==='menuBtn'){document.getElementById('app').classList.toggle('open');return}
 if(d.nav){S.view=d.nav;S.open=null;document.getElementById('app').classList.remove('open');render();scrollTo(0,0);return}
 if(d.open){S.open=+d.open;S.confirmReserve=false;renderLayer();return}
 if('close' in d){S.open=null;renderLayer();return}
 if(d.grade){S.view='grading';S.gradeSel=d.grade;render();return}
 if(d.gsel){S.gradeSel=d.gsel;render();return}
 if(d.fpkg){S.fPkg=d.fpkg;render();return}
 if(d.fst){S.fSt=d.fst;render();return}
 if(d.skill){S.bankSkill=d.skill;render();return}
 if(d.assignto){S.assignTo=d.assignto;S.view='assign';render();return}
 if(d.filtercls){S.view='students';S.q='';S.fSt='all';S.fPkg='all';render();toast('Lọc theo lớp '+d.filtercls+' khi nối dữ liệu thật');return}
 if(d.toast){toast(d.toast);return}
 if(d.place){const en=S.entry[+d.place];const target=rec(en.overall)[1].split(' / ').pop();en.placed=true;if(en.st){const s=stu(en.st);s.cls=target;log(s.name+' — Xếp vào lớp '+target+' theo test đầu vào '+en.overall)}render();toast('Đã xếp lớp '+target);return}
 if(d.days){document.getElementById('dDays').value=d.days;return}
 if(d.act){const s=stu(S.open);
  if(d.act==='pkg'){const v=document.getElementById('dPkg').value;if(v===s.pkg){toast('Gói không thay đổi');return}s.pkg=v;if(s.cls&&cls(s.cls).pkg!==v)s.cls='';log(s.name+' — Đổi gói học sang PTE '+v);toast('Đã đổi sang PTE '+v)}
  if(d.act==='extend'){const n=parseInt(document.getElementById('dDays').value,10);if(!(n>0)){toast('Nhập số ngày lớn hơn 0');return}s.exp=addDays(s.exp,n);log(s.name+' — Gia hạn '+n+' ngày (hạn mới: '+fmt(s.exp)+')');toast('Đã gia hạn '+n+' ngày, hạn mới '+fmt(s.exp))}
  if(d.act==='reserve'){S.confirmReserve=true;renderLayer();return}
  if(d.act==='reserveNo'){S.confirmReserve=false;renderLayer();return}
  if(d.act==='reserveYes'){s.res--;s.exp=addDays(s.exp,30);S.confirmReserve=false;log(s.name+' — Dùng 1 lượt bảo lưu, gia hạn 30 ngày (hạn mới: '+fmt(s.exp)+')');toast('Đã dùng 1 lượt bảo lưu')}
  if(d.act==='cls'){const v=document.getElementById('dCls').value;s.cls=v;log(s.name+' — '+(v?'Xếp vào lớp '+v:'Rời lớp'));toast(v?'Đã xếp vào '+v:'Đã bỏ xếp lớp')}
  render();return}
});
document.addEventListener('input',e=>{
 if(e.target.id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=document.getElementById('q');q.focus();q.setSelectionRange(pos,pos)}
 if(e.target.closest&&e.target.closest('#gForm')&&e.target.type==='number'){const ins=[...document.querySelectorAll('#gForm .crit input')];const ok=ins.every(i=>i.value!=='');document.getElementById('gTot').textContent=ok?ins.reduce((a,i)=>a+Math.min(+i.max,Math.max(0,+i.value)),0):'–'}
});
document.addEventListener('change',e=>{
 if(e.target.id==='roleSel'){S.role=e.target.value;S.open=null;render()}
 if(e.target.id==='tuOnly'){S.bankTu=e.target.checked;render()}
 if(e.target.id==='aCls'){S.assignTo=e.target.value;const keep=document.getElementById('aTitle').value;render();document.getElementById('aTitle').value=keep}
});
document.addEventListener('submit',e=>{
 e.preventDefault();
 if(e.target.id==='asgForm'){
  const title=document.getElementById('aTitle').value.trim();const types=[...document.querySelectorAll('#aTypes input:checked')].map(i=>i.value);
  if(!title||!types.length){document.getElementById('aErr').textContent=!title?'Nhập tên bài tập.':'Chọn ít nhất 1 dạng bài.';return}
  const c=document.getElementById('aCls').value;
  S.assignments.push({id:'A'+(S.assignments.length+1),title,cls:c,kind:document.getElementById('aKind').value,types,qty:+document.getElementById('aQty').value||1,due:document.getElementById('aDue').value||iso(TODAY),sub:0,of:S.students.filter(s=>s.cls===c).length});
  render();toast('Đã giao bài cho lớp '+c);
 }
 if(e.target.id==='gForm'){
  const x=S.subs.find(y=>y.id===S.gradeSel);const ins=[...document.querySelectorAll('#gForm .crit input')];
  if(ins.some(i=>i.value===''||+i.value<0||+i.value>+i.max)){document.getElementById('gErr').textContent='Nhập đủ điểm từng tiêu chí, trong khoảng cho phép.';return}
  const parts=ins.map(i=>+i.value);x.score={parts,got:parts.reduce((a,b)=>a+b,0),max:RUBRIC[x.type].c.reduce((a,b)=>a+b[1],0),note:document.getElementById('gNote').value};x.status='graded';
  log(stu(x.st).name+' — Đã chấm '+RUBRIC[x.type].label+': '+x.score.got+'/'+x.score.max);
  const next=S.subs.find(y=>y.status==='pending');S.gradeSel=next?next.id:x.id;render();toast('Đã lưu điểm và trả bài');
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.open){S.open=null;renderLayer()}});
try{const p=JSON.parse(localStorage.getItem('pteadm')||'{}');if(p.role&&ROLES[p.role])S.role=p.role;if(p.view&&TITLES[p.view])S.view=p.view}catch(e){}
const h=location.hash.slice(1);if(TITLES[h])S.view=h;
render();
</script>
</body>
</html>
